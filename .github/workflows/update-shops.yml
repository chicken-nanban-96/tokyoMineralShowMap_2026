name: 池袋ショー 出展者一覧を公式サイトから更新

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_shops.py'
      - '.github/workflows/update-shops.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Retrieve all 10 exhibitor pages
        run: python scripts/update_shops.py
      - name: Commit updated shops.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shops.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update 2026 Tokyo Mineral Show exhibitors'
            git push
          fi
